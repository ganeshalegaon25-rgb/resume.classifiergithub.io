<!DOCTYPE html>
<html>

<head>
    <title>AI Resume Classifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 60%;
            margin: auto;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            color: #333;
        }

        input {
            margin-top: 20px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 30px;
            font-size: 22px;
            color: green;
        }

        #scoreBarContainer {
            width: 80%;
            background-color: #ddd;
            margin: 20px auto;
            border-radius: 10px;
        }

        #scoreBar {
            height: 30px;
            width: 0%;
            background-color: green;
            border-radius: 10px;
            line-height: 30px;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AI Resume Screening & Classification System</h1>

        <p>Upload Resume PDF</p>

        <input type="file" id="pdfFile" accept=".pdf">

        <br>

        <button onclick="analyzePDF()">Analyze Resume</button>

        <div id="result"></div>

        <div id="scoreBarContainer">
            <div id="scoreBar">0%</div>
        </div>

    </div>

    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <!-- JS File -->
    <script src="script.js"></script>

</body>

</html>
