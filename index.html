<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Screener</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        input, button {
            margin-top: 10px;
            padding: 10px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            color: green;
        }
    </style>
</head>

<body>

    <h1>AI Resume Screening System</h1>

    <p>Upload your resume (PDF):</p>

    <!-- ✅ PDF Upload -->
    <input type="file" id="pdfFile" accept=".pdf"><br>

    <!-- ✅ Button -->
    <button onclick="analyzePDF()">Analyze Resume</button>

    <!-- ✅ Result -->
    <h2 id="result"></h2>

    <!-- ✅ PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <!-- ✅ Your Script -->
    <script src="script.js"></script>

</body>
</html>
